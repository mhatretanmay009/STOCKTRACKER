{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white border-0 pt-4 px-4 fw-bold fs-4">
                    📝 Create New Transaction / Invoice
                </div>
                <div class="card-body p-4">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger">{{ message }}</div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Type</label>
                                <select name="transaction_type" class="form-select" required>
                                    <option value="OUT">Outward (Sale to Customer)</option>
                                    <option value="IN">Inward (Purchase from Supplier)</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Product</label>
                                <select name="product_id" class="form-select" required>
                                    <option value="">Select Product...</option>
                                    {% for p in products %}
                                        <option value="{{ p.id }}">{{ p.name }} (Available: {{ p.quantity }})</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Customer / Supplier Name</label>
                                <input type="text" name="party_name" class="form-control" placeholder="e.g. Acme Corp" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-bold small">Quantity</label>
                                <input type="number" name="quantity" class="form-control" min="1" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-bold small">Price per Unit (₹)</label>
                                <input type="number" step="0.01" name="unit_price" class="form-control" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold small">Notes / Remarks</label>
                                <textarea name="notes" class="form-control" rows="2" placeholder="Optional transaction details..."></textarea>
                            </div>
                        </div>

                        <div class="mt-4 text-end">
                            <button type="submit" class="btn btn-primary px-4 fw-bold">Generate Invoice</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
