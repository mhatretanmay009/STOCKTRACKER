{% extends 'base.html' %}

{% block content %}
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🧾 Create New Bill / Invoice</h2>
        <a href="{% url 'home' %}" class="btn btn-outline-secondary">← Back to Dashboard</a>
    </div>

    <form method="POST" id="invoiceForm">
        {% csrf_token %}
        <div class="card shadow-sm border-0 p-4 mb-4">
            <h5 class="fw-bold mb-3">1. General Information</h5>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Transaction Type</label>
                    <select name="transaction_type" class="form-select" required>
                        <option value="OUT">Outward (Stock Delivered / Sales)</option>
                        <option value="IN">Inward (Stock Received / Purchase)</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Customer / Supplier Name</label>
                    <input type="text" name="party_name" class="form-control" placeholder="e.g. Acme Corp / Rahul Sharma" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Contact Number</label>
                    <input type="text" name="contact_number" class="form-control" placeholder="e.g. +91 98765 43210">
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold m-0">2. Select Items</h5>
                <button type="button" class="btn btn-sm btn-success" id="addRowBtn">+ Add Another Item</button>
            </div>

            <table class="table table-bordered align-middle" id="itemsTable">
                <thead class="table-light">
                    <tr>
                        <th style="width: 40%;">Product</th>
                        <th style="width: 20%;">Quantity</th>
                        <th style="width: 25%;">Unit Price (₹)</th>
                        <th style="width: 15%;">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <select name="product_id[]" class="form-select product-select" required>
                                <option value="" disabled selected>-- Select Product --</option>
                                {% for product in products %}
                                    <option value="{{ product.id }}" data-price="{{ product.unit_price }}">
                                        {{ product.name }} (Stock: {{ product.quantity }})
                                    </option>
                                {% endfor %}
                            </select>
                        </td>
                        <td>
                            <input type="number" name="quantity[]" class="form-control qty-input" min="1" value="1" required>
                        </td>
                        <td>
                            <input type="number" step="0.01" name="unit_price[]" class="form-control price-input" placeholder="0.00" required>
                        </td>
                        <td class="text-center">
                            <button type="button" class="btn btn-sm btn-danger remove-row-btn">Remove</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="text-end">
            <button type="submit" class="btn btn-primary btn-lg px-5">Generate Bill & Update Stock</button>
        </div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const tableBody = document.querySelector('#itemsTable tbody');
    const addRowBtn = document.querySelector('#addRowBtn');

    // Auto-fill price when product is selected
    tableBody.addEventListener('change', function (e) {
        if (e.target.classList.contains('product-select')) {
            const selectedOption = e.target.options[e.target.selectedIndex];
            const price = selectedOption.getAttribute('data-price') || 0;
            const row = e.target.closest('tr');
            row.querySelector('.price-input').value = price;
        }
    });

    // Add new row
    addRowBtn.addEventListener('click', function () {
        const firstRow = tableBody.querySelector('tr');
        const newRow = firstRow.cloneNode(true);
        newRow.querySelector('.product-select').selectedIndex = 0;
        newRow.querySelector('.qty-input').value = 1;
        newRow.querySelector('.price-input').value = '';
        tableBody.appendChild(newRow);
    });

    // Remove row
    tableBody.addEventListener('click', function (e) {
        if (e.target.classList.contains('remove-row-btn')) {
            if (tableBody.querySelectorAll('tr').length > 1) {
                e.target.closest('tr').remove();
            } else {
                alert('An invoice must contain at least one item.');
            }
        }
    });
});
</script>
{% endblock %}
