{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center my-5">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-body p-4 p-sm-5">
                <div class="text-center mb-4">
                    <span class="fs-1">🔑</span>
                    <h4 class="fw-bold text-dark mt-2">Reset Password</h4>
                    <p class="text-muted small">Enter your username to request approval from an Admin or Manager.</p>
                </div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} py-2 small" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold text-secondary small">Username</label>
                        <input type="text" name="username" class="form-control" id="id_username" placeholder="Enter your username" required>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary fw-bold py-2">Submit Request</button>
                    </div>

                    <div class="text-center">
                        <a href="{% url 'login' %}" class="text-decoration-none small text-muted">Back to Log In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
