<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StockTracker{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background-color: #f8f9fa;
        }

        #wrapper {
            display: flex;
            width: 100%;
            align-items: stretch;
            min-height: 100vh;
        }

        #sidebar {
            min-width: 250px;
            max-width: 250px;
            background-color: #1e1f2e;
            color: #ffffff;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        #sidebar.active {
            margin-left: -250px;
        }

        #sidebar .nav-link {
            color: rgba(255, 255, 255, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 4px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        #sidebar .nav-link:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.1);
        }

        #sidebar .nav-link.active {
            color: #ffffff;
            background-color: #0d6efd;
            font-weight: 600;
        }

        #content {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="bg-light">

    <div id="wrapper">
        <!-- Sidebar Navigation -->
        <nav id="sidebar" class="p-3">
            <div class="mb-4 text-start px-2">
                <a href="{% url 'home' %}" class="text-white text-decoration-none fw-bold fs-4 d-flex align-items-center gap-2">
                    <span>📦</span> StockTracker
                </a>
            </div>

            <!-- Mapped Sidebar Links -->
            <div class="nav flex-column gap-1">
                <a href="{% url 'company_settings' %}" class="nav-link {% if request.resolver_match.url_name == 'company_settings' %}active{% endif %}">
                    ⚙️ Settings
                </a>
                <a href="{% url 'home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                    📈 Dashboard
                </a>
                <a href="{% url 'export_inventory_csv' %}" class="nav-link {% if request.resolver_match.url_name == 'export_inventory_csv' %}active{% endif %}">
                    📊 Export CSV
                </a>
                <a href="{% url 'create_transaction' %}" class="nav-link {% if request.resolver_match.url_name == 'create_transaction' %}active{% endif %}">
                    📝 Create New Bill
                </a>
                <a href="{% url 'invoice_history' %}" class="nav-link {% if request.resolver_match.url_name == 'invoice_history' %}active{% endif %}">
                    🕒 Invoice History
                </a>
                <a href="{% url 'supplier_list' %}" class="nav-link {% if request.resolver_match.url_name == 'supplier_list' %}active{% endif %}">
                    🚚 Suppliers
                </a>
                <a href="{% url 'customer_list' %}" class="nav-link {% if request.resolver_match.url_name == 'customer_list' %}active{% endif %}">
                    👥 Customers
                </a>
            </div>

            <!-- User Auth Footer -->
            {% if user.is_authenticated %}
                <div class="mt-auto pt-3 border-top border-secondary">
                    <p class="small text-muted mb-1">Logged in as:</p>
                    <p class="fw-bold text-white mb-2">{{ user.username }}</p>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm w-100">Logout</button>
                    </form>
                </div>
            {% endif %}
        </nav>

        <!-- Main Content Area -->
        <div id="content">
            <!-- Top Header Navbar -->
            <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm px-3">
                <div class="container-fluid p-0">
                    <button class="btn btn-outline-dark me-2" id="sidebarCollapse" type="button">
                        ☰
                    </button>
                    <span class="navbar-text fw-semibold text-secondary">
                        Inventory Dashboard
                    </span>
                </div>
            </nav>

            <!-- Page Body Content -->
            <div class="container-fluid p-4">
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Sidebar Toggle Script -->
    <script>
        document.getElementById('sidebarCollapse').addEventListener('click', function () {
            document.getElementById('sidebar').classList.toggle('active');
        });
    </script>
</body>
</html>
