{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light py-5">
    <div class="card border-0 shadow-sm p-4 rounded-4" style="max-width: 440px; width: 100%; background: #ffffff;">

        <!-- Header -->
        <div class="text-center mb-4">
            <div class="mb-2" style="font-size: 2.5rem;">📦</div>
            <h3 class="fw-bold text-dark m-0">Create Account</h3>
            <p class="text-muted small mt-1">Sign up to manage your warehouse inventory</p>
        </div>

        <!-- Form -->
        <form method="POST">
            {% csrf_token %}

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger p-2 small mb-3">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <!-- Username Field -->
            <div class="mb-3">
                <label for="id_username" class="form-label text-secondary small fw-semibold mb-1">Username</label>
                <input type="text"
                       name="username"
                       id="id_username"
                       class="form-control rounded-3 py-2 px-3"
                       placeholder="Enter username"
                       required>
            </div>

            <!-- Email Field -->
            <div class="mb-3">
                <label for="id_email" class="form-label text-secondary small fw-semibold mb-1">Email</label>
                <input type="email"
                       name="email"
                       id="id_email"
                       class="form-control rounded-3 py-2 px-3"
                       placeholder="Enter email address">
            </div>

            <!-- Password Field -->
            <div class="mb-3">
                <label for="id_password" class="form-label text-secondary small fw-semibold mb-1">Password</label>
                <input type="password"
                       name="password"
                       id="id_password"
                       class="form-control rounded-3 py-2 px-3"
                       placeholder="Enter password"
                       required>
            </div>

            <!-- Role Selection Dropdown -->
            <div class="mb-3">
                <label for="id_role" class="form-label text-secondary small fw-semibold mb-1">Select Role</label>
                <select name="role" id="id_role" class="form-select rounded-3 py-2 px-3">
                    <option value="VIEWER">Viewer</option>
                    <option value="SALES">Sales</option>
                    <option value="PURCHASER">Purchaser</option>
                    <option value="ACCOUNTANT">Accountant</option>
                    <option value="MANAGER">Manager</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3 mt-2">Sign Up</button>
        </form>

        <!-- Footer -->
        <div class="text-center small text-muted">
            Already have an account?
            <a href="{% url 'login' %}" class="text-primary text-decoration-none fw-semibold">Log in here</a>
        </div>

    </div>
</div>
{% endblock %}
